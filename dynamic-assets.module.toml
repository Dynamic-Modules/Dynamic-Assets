id = "dynamic-assets"
name = "Dynamic Assets"
version = "1.0.0"
module_api = "1"
description = "Asset-side prepare metadata and dynamic asset contribution indexing support."

[source]
repo = "https://github.com/Dynamic-Modules/Dynamic-Assets.git"
default_branch = "main"

[compat]
target = "tgstation"
minimum_dynamic_modules = "1.0.0"

[build]
dm_files = []
test_files = []
assets = []
tgui = []

[[prepare_plugins]]
id = "dynamic-assets-index"
command = "python3"
args = ["prepare_plugin.py"]
description = "Writes an asset metadata index from module build.assets declarations."
